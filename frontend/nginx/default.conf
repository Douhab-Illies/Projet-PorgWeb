server {
  listen 80;
  server_name _;

  # Front static files
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Proxy API to gateway (inside Docker network / K8s service)
  location /api/ {
    proxy_pass http://api-gateway:8081/api/;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://api-gateway:8081/health;
    proxy_set_header Host $host;
  }
}
